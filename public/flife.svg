<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <!-- 
      O patternUnits="userSpaceOnUse" garante que a escala do pattern 
      permaneça consistente independentemente do tamanho do container.
    -->
    <pattern id="flower-of-life" patternUnits="userSpaceOnUse" width="50" height="86.6025">
      <g fill="none" stroke="#ffffff" stroke-width="1.5">
        <!-- Linha Superior Externa (Sangria) -->
        <circle cx="25" cy="-43.3013" r="50"/>
        
        <!-- Linha 1 (Topo) -->
        <circle cx="-50" cy="0" r="50"/>
        <circle cx="0" cy="0" r="50"/>
        <circle cx="50" cy="0" r="50"/>
        <circle cx="100" cy="0" r="50"/>
        
        <!-- Linha 2 (Centro) -->
        <circle cx="-25" cy="43.3013" r="50"/>
        <circle cx="25" cy="43.3013" r="50"/>
        <circle cx="75" cy="43.3013" r="50"/>
        
        <!-- Linha 3 (Base) -->
        <circle cx="-50" cy="86.6025" r="50"/>
        <circle cx="0" cy="86.6025" r="50"/>
        <circle cx="50" cy="86.6025" r="50"/>
        <circle cx="100" cy="86.6025" r="50"/>
        
        <!-- Linha Inferior Externa (Sangria) -->
        <circle cx="25" cy="129.9038" r="50"/>
      </g>
    </pattern>
  </defs>

  <!-- Retângulo que renderiza o pattern. 
       Isso será usado como máscara no seu CSS/Framer Motion. -->
  <rect width="100%" height="100%" fill="url(#flower-of-life)" />
</svg>
